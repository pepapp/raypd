name: lint

on:
  push:
    paths:
      - "terraform/**"
      - "bootstrap/**"
      - "scripts/stacks.py"
      - ".tflint.hcl"
      - ".github/workflows/lint.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_VERSION: "~1.13.0"
  TF_IN_AUTOMATION: "true"

jobs:
  fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

  # Finds every stack (dir with backend.tf) under terraform/, ordered by tf_info depends_on.
  # Fails here if a depends_on points at an unknown stack or forms a cycle.
  stacks:
    name: discover stacks
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.discover.outputs.list }}
    steps:
      - uses: actions/checkout@v4

      - id: discover
        run: |
          list=$(python3 scripts/stacks.py | jq -c '. + ["bootstrap"]')
          echo "Stacks: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

  validate:
    name: validate (${{ matrix.stack }})
    needs: stacks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.stacks.outputs.list) }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init (no backend)
        working-directory: ${{ matrix.stack }}
        run: terraform init -backend=false -input=false

      - name: terraform validate
        working-directory: ${{ matrix.stack }}
        run: terraform validate

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: terraform-linters/setup-tflint@v4

      - name: Cache tflint plugins
        uses: actions/cache@v4
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ hashFiles('.tflint.hcl') }}

      - name: tflint --init
        run: tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }}   # plugin download from GitHub releases, avoids the anonymous rate limit

      - name: tflint
        run: tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact