name: terraform

on:
  push:
    paths:
      - "terraform/**"
      - "scripts/stacks.py"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required to request the GitHub OIDC token

env:
  TF_VERSION: "~1.13.0"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: us-east-2

jobs:
  stacks:
    name: discover stacks
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.discover.outputs.list }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: discover
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
            echo "Changed files:"; echo "$changed"
            if echo "$changed" | grep -qxE 'scripts/stacks\.py|\.github/workflows/terraform\.yml'; then
              list=$(python3 scripts/stacks.py)                        # pipeline itself changed: run all
            else
              list=$(echo "$changed" | python3 scripts/stacks.py --changed)
            fi
          else
            list=$(python3 scripts/stacks.py)                          # manual run / new branch / force push
          fi
          echo "Stacks to run (in order): $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

  plan:
    name: plan (${{ matrix.stack }})
    needs: stacks
    if: needs.stacks.outputs.list != '[]' # nothing affected -> nothing to plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.stacks.outputs.list) }}

    concurrency:
      group: terraform-plan-${{ github.ref }}-${{ matrix.stack }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC -> plan role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          role-session-name: gha-plan-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        working-directory: ${{ matrix.stack }}
        run: terraform init

      - name: terraform plan
        working-directory: ${{ matrix.stack }}
        run: terraform plan -lock-timeout=5m

  apply:
    name: apply (all stacks, in order)
    needs: [stacks, plan]

    if: github.ref == 'refs/heads/master' && needs.stacks.outputs.list != '[]'
    runs-on: ubuntu-latest

    concurrency:
      group: terraform-apply
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC -> apply role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          role-session-name: gha-apply-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 7200

      - name: terraform apply (dependency order)
        env:
          STACKS: ${{ needs.stacks.outputs.list }}
        run: |
          for dir in $(echo "$STACKS" | jq -r '.[]'); do
            echo "::group::$dir"
            terraform -chdir="$dir" init
            rc=0
            terraform -chdir="$dir" plan -lock-timeout=5m -detailed-exitcode -out=tfplan || rc=$?
            case $rc in
              0) echo "No changes in $dir - skipping apply" ;;
              2) terraform -chdir="$dir" apply -lock-timeout=5m tfplan ;;
              *) echo "::error::plan failed in $dir"; exit "$rc" ;;
            esac
            echo "::endgroup::"
          done